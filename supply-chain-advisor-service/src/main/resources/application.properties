# =========================================================
# Application
# =========================================================
spring.application.name=supply-chain-advisor-service
server.port=8080

# =========================================================
# DataSource — H2 In-Memory
# To switch databases: replace the url/driver/dialect below
# with the target RDBMS values and swap the H2 runtime
# dependency in pom.xml for the appropriate JDBC driver.
# =========================================================
spring.datasource.url=jdbc:h2:mem:supplychain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================================================
# H2 Console (disable in production profiles)
# Access at: http://localhost:8080/h2-console
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# =========================================================
# GDACS Alert Intelligence
# Comma-separated list of <gdacs:alertlevel> values to
# persist and trigger shipment re-evaluation for.
# Values must be UPPERCASE with no surrounding whitespace.
# =========================================================
gdacs.alert.severities=RED,ORANGE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# SpringDoc / Swagger UI
# Access at: http://localhost:8080/swagger-ui.html
# =========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
